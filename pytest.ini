[pytest]
# Pytest configuration for Epic Voice Suite backend tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = backend/tests

# Asyncio mode (for async tests)
asyncio_mode = auto

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database required)
    idempotency: Idempotency verification tests
    multitenant: Multi-tenant isolation tests
    slow: Slow-running tests (skip with -m "not slow")

# Minimum version
minversion = 7.0

# Console output options
console_output_style = progress

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (if pytest-cov installed)
# Run with: pytest --cov=backend/call_outcomes --cov-report=html
[coverage:run]
source = backend/call_outcomes
omit =
    */tests/*
    */conftest.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
